# Hexacademy on a shared VPS behind Cloudflare. Server blocks match only
# hexacademynepal.com names (and port 8090), so other sites on this Nginx are
# untouched. Install as /etc/nginx/sites-available/hexacademy-nepal and symlink
# into sites-enabled. Zone and upstream names are prefixed to avoid clashing
# with other sites' http-level definitions.
#
# Prerequisites on the server (docs/deployment.md):
#   /etc/nginx/snippets/hexacademy-cloudflare-real-ip.inc  (Cloudflare ranges)
#   /etc/letsencrypt/live/hexacademynepal.com/              (certbot --webroot)

limit_req_zone $binary_remote_addr zone=hexacademy_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=hexacademy_api:10m rate=20r/s;

upstream hexacademy_django {
    server 127.0.0.1:8050;
    keepalive 16;
}

upstream hexacademy_next {
    server 127.0.0.1:3050;
    keepalive 16;
}

# HTTP: ACME challenges for renewal, everything else to HTTPS on the apex.
server {
    listen 80;
    listen [::]:80;
    server_name hexacademynepal.com www.hexacademynepal.com;
    location /.well-known/acme-challenge/ { root /var/www/SHIV/hexacademy-nepal/.acme; }
    location / { return 301 https://hexacademynepal.com$request_uri; }
}

# The original IP:port staging address now forwards to the domain.
server {
    listen 8090;
    listen [::]:8090;
    server_name _;
    return 301 https://hexacademynepal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hexacademynepal.com;
    ssl_certificate /etc/letsencrypt/live/hexacademynepal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexacademynepal.com/privkey.pem;
    return 301 https://hexacademynepal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hexacademynepal.com;

    ssl_certificate /etc/letsencrypt/live/hexacademynepal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hexacademynepal.com/privkey.pem;
    # TLS protocols and ciphers come from the shared http-level settings.

    # Visitor IPs from Cloudflare's header, trusted only from Cloudflare ranges.
    include /etc/nginx/snippets/hexacademy-cloudflare-real-ip.inc;

    client_max_body_size 50m;  # keep in sync with MAX_UPLOAD_SIZE_MB

    access_log /var/log/nginx/hexacademy.access.log;
    error_log /var/log/nginx/hexacademy.error.log;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Single trusted hop: overwrite (do not append) so clients cannot spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    location = /healthz/ { proxy_pass http://hexacademy_django; access_log off; }
    location = /readyz/  { proxy_pass http://hexacademy_django; access_log off; }

    location /api/v1/auth/ {
        limit_req zone=hexacademy_auth burst=10 nodelay;
        proxy_pass http://hexacademy_django;
    }

    location /api/ {
        limit_req zone=hexacademy_api burst=40 nodelay;
        proxy_pass http://hexacademy_django;
        proxy_read_timeout 60s;
    }

    location /django-admin/ {
        limit_req zone=hexacademy_auth burst=20 nodelay;
        proxy_pass http://hexacademy_django;
    }

    location /static/ {
        alias /var/www/SHIV/hexacademy-nepal/backend/staticfiles/;
        expires 30d;
        access_log off;
    }

    # Public media only. Private files live in backend/private_media, which
    # Nginx never serves; Django releases them after an access check.
    location /media/ {
        alias /var/www/SHIV/hexacademy-nepal/backend/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(html?|svg|js|xml)$ { add_header Content-Disposition attachment always; add_header X-Content-Type-Options nosniff always; }
    }

    location /_next/static/ {
        proxy_pass http://hexacademy_next;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        # no-transform stops Cloudflare rewriting pages (e.g. Email Address
        # Obfuscation), which would break React hydration and inject scripts the
        # CSP blocks. add_header here replaces the server-level one, so repeat it.
        add_header Cache-Control "no-transform" always;
        add_header X-Request-ID $request_id always;
        proxy_pass http://hexacademy_next;
    }
}
