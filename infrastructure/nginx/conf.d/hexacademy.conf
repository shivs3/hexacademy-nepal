upstream django {
    server backend:8000;
    keepalive 16;
}

upstream nextjs {
    server frontend:3000;
    keepalive 16;
}

# TLS terminates at Cloudflare (Full (strict) with an origin certificate) or at
# a host-level proxy; see docs/deployment.md. This block serves the origin.
server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 50m;  # keep in sync with MAX_UPLOAD_SIZE_MB

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Single trusted hop: overwrite (do not append) so clients cannot spoof it.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Request-ID $request_id;
    add_header X-Request-ID $request_id always;

    location = /healthz/ { proxy_pass http://django; access_log off; }
    location = /readyz/  { proxy_pass http://django; access_log off; }

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://django;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://django;
        proxy_read_timeout 60s;
    }

    location /django-admin/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://django;
    }

    location /static/ {
        proxy_pass http://django;
        expires 30d;
        access_log off;
    }

    # Public media only. Private files are never mounted into Nginx; they are
    # served through short-lived signed object-storage URLs.
    location /media/ {
        alias /srv/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        location ~* \.(html?|svg|js|xml)$ { add_header Content-Disposition attachment always; add_header X-Content-Type-Options nosniff always; }
    }

    location /_next/static/ {
        proxy_pass http://nextjs;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://nextjs;
    }
}
