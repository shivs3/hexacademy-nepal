worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Query strings may carry one-time tokens; log the path only.
    log_format main '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent $request_time "$http_user_agent" rid=$request_id';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Real client IPs behind Cloudflare. Generated from Cloudflare's published
    # ranges by infrastructure/nginx/update-cloudflare-ips.sh; empty until run.
    include /etc/nginx/conf.d/cloudflare-real-ip.inc;

    limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;  # coarse flood guard; Django applies the precise per-endpoint throttles
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
