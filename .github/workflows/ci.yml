name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hexacademy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/hexacademy_test
      DATABASE_URL: postgres://ci:ci@localhost:5432/hexacademy_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest --create-db

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: hexacademy_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/hexacademy_e2e
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Throwaway account in the disposable CI database only.
      E2E_EDITOR_EMAIL: e2e-editor@example.com
      E2E_EDITOR_PASSWORD: ci-only-E2E-editor-91
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: backend
        run: |
          pip install -r requirements.txt
          python manage.py migrate --noinput
          python manage.py shell -c "
          import os
          from django.utils import timezone
          from apps.accounts.models import User
          u = User.objects.create_user(email=os.environ['E2E_EDITOR_EMAIL'], password=os.environ['E2E_EDITOR_PASSWORD'], full_name='E2E Editor')
          u.is_staff = True; u.email_verified_at = timezone.now(); u.save()"
          python manage.py grant_role "$E2E_EDITOR_EMAIL" --role content_editor
          python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx next start -p 3000 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/login >/dev/null && curl -sf http://127.0.0.1:8000/healthz/ >/dev/null && break; sleep 1; done
          npm run e2e
      - if: failure()
        run: tail -n 200 /tmp/django.log /tmp/next.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
